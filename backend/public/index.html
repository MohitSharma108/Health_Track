<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nourish — AI Nutrition Tracker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nourish">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NOURISH — design tokens
   ============================================================ */
:root{
  --ink:#211D1A; --ink-soft:#5B5449; --ink-faint:#8B8375;
  --paper:#FAF5EC; --card:#FFFFFF; --card-tint:#F4ECDD; --line:#E6DBC7;
  --coral:#E5573F; --coral-dark:#C43F2A; --coral-soft:#FBE1DA;
  --leaf:#3E7A54; --leaf-dark:#2E5D40; --leaf-soft:#DEEEE1;
  --amber:#C98A2C; --amber-soft:#F5E6C8;
  --protein:#8A4560; --protein-soft:#F2DDE6;
  --carbs:#C98A2C; --carbs-soft:#F5E6C8;
  --fat:#3E6E86; --fat-soft:#DCE9EE;
  --fibre:#3E7A54; --fibre-soft:#DEEEE1;
  --danger:#C0392B; --danger-soft:#F6DCD8;
  --shadow-sm:0 1px 2px rgba(33,29,26,.05);
  --shadow-md:0 2px 6px rgba(33,29,26,.06), 0 10px 24px rgba(33,29,26,.07);
  --radius-sm:10px; --radius-md:16px; --radius-lg:26px; --radius-pill:999px;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --nav-h:64px; --topbar-h:auto;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --ink:#F1EBDF; --ink-soft:#C9C0AF; --ink-faint:#8B8375;
  --paper:#15130F; --card:#1E1B15; --card-tint:#242019; --line:#332E24;
  --coral:#F16A50; --coral-dark:#FF7E63; --coral-soft:#3A2019;
  --leaf:#5AA173; --leaf-dark:#7CC496; --leaf-soft:#152A1C;
  --amber:#D9A147; --amber-soft:#2E2312;
  --protein:#C97C9C; --protein-soft:#2E1B24;
  --carbs:#D9A147; --carbs-soft:#2E2312;
  --fat:#6FA9C4; --fat-soft:#16262C;
  --fibre:#5AA173; --fibre-soft:#152A1C;
  --danger:#E06A5A; --danger-soft:#2E1815;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 10px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --ink:#F1EBDF; --ink-soft:#C9C0AF; --ink-faint:#8B8375;
    --paper:#15130F; --card:#1E1B15; --card-tint:#242019; --line:#332E24;
    --coral:#F16A50; --coral-dark:#FF7E63; --coral-soft:#3A2019;
    --leaf:#5AA173; --leaf-dark:#7CC496; --leaf-soft:#152A1C;
    --amber:#D9A147; --amber-soft:#2E2312;
    --protein:#C97C9C; --protein-soft:#2E1B24;
    --carbs:#D9A147; --carbs-soft:#2E2312;
    --fat:#6FA9C4; --fat-soft:#16262C;
    --fibre:#5AA173; --fibre-soft:#152A1C;
    --danger:#E06A5A; --danger-soft:#2E1815;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
button, input, select, textarea{ font-family:inherit; color:inherit; }
a{ color:inherit; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

#app{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(var(--nav-h) + 18px); }
.screen{ padding:0 16px 8px; animation:fadeIn .22s ease; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

/* Topbar */
.topbar{ padding:18px 16px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.topbar .greet{ font-family:var(--font-display); font-size:22px; font-weight:600; line-height:1.15; }
.topbar .date{ font-size:13px; color:var(--ink-faint); margin-top:2px; }
.avatar{ width:38px; height:38px; border-radius:50%; background:var(--coral); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:none; cursor:pointer; border:none; }
.icon-btn{ width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex:none; position:relative;}
.icon-btn svg{ width:18px; height:18px; }
.dot-badge{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--coral); border:1.5px solid var(--card); }

/* Cards */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.card.tight{ padding:14px; }
.card h3{ margin:0 0 10px; font-family:var(--font-ui); font-size:14px; font-weight:700; }
.section-label{ font-size:13px; font-weight:700; color:var(--ink-soft); margin:20px 2px 10px; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.stack{ display:flex; flex-direction:column; gap:10px; }
.muted{ color:var(--ink-faint); }
.small{ font-size:12.5px; }

/* Buttons */
.btn{ appearance:none; border:none; border-radius:var(--radius-pill); padding:13px 20px; font-weight:700; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .1s ease, opacity .15s ease; }
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--coral); color:#fff; }
.btn-leaf{ background:var(--leaf); color:#fff; }
.btn-ghost{ background:var(--card-tint); color:var(--ink); }
.btn-outline{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
.btn-danger{ background:var(--danger-soft); color:var(--danger); }
.btn-block{ width:100%; }
.btn-sm{ padding:8px 14px; font-size:13px; border-radius:var(--radius-pill); }
.btn:disabled{ opacity:.5; cursor:default; }
.fab{ position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:40; }

/* Forms */
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea{
  border:1.5px solid var(--line); background:var(--paper); border-radius:var(--radius-sm); padding:11px 12px; font-size:15px; color:var(--ink); width:100%;
}
.field textarea{ resize:vertical; min-height:64px; font-family:inherit; }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--coral); outline-offset:1px; }
.choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.choice-grid.c3{ grid-template-columns:1fr 1fr 1fr; }
.choice{ border:1.5px solid var(--line); background:var(--card); border-radius:var(--radius-md); padding:12px 10px; text-align:center; font-size:13.5px; font-weight:600; cursor:pointer; }
.choice.active{ border-color:var(--coral); background:var(--coral-soft); color:var(--coral-dark); }
.chip{ display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); border-radius:var(--radius-pill); padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; background:var(--card); }
.chip.active{ border-color:var(--leaf); background:var(--leaf-soft); color:var(--leaf-dark); }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }

/* Bottom nav */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; display:flex; justify-content:center; }
.tabbar-inner{ width:100%; max-width:480px; background:var(--card); border-top:1px solid var(--line); display:flex; align-items:center; padding:8px 6px calc(env(safe-area-inset-bottom,0) + 8px); box-shadow:0 -6px 20px rgba(0,0,0,.05); }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 2px; }
.tab svg{ width:21px; height:21px; }
.tab.active{ color:var(--coral); }
.tab-scan{ margin-top:-26px; }
.tab-scan .scan-circle{ width:52px; height:52px; border-radius:50%; background:var(--coral); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(229,87,63,.45); }
.tab-scan .scan-circle svg{ width:24px; height:24px; }
.tab-scan.active .scan-circle{ background:var(--coral-dark); }

/* Ring */
.ring-wrap{ position:relative; width:172px; height:172px; margin:4px auto 6px; }
.ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-num{ font-family:var(--font-display); font-size:34px; font-weight:600; line-height:1; }
.ring-label{ font-size:12px; color:var(--ink-faint); margin-top:4px; font-weight:600; }

/* Macro bars */
.macro-row{ display:flex; align-items:center; gap:10px; padding:9px 0; }
.macro-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
.macro-info{ flex:1; min-width:0; }
.macro-top{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:5px; }
.macro-top span.val{ color:var(--ink-faint); font-weight:500; }
.bar-track{ height:7px; border-radius:8px; background:var(--card-tint); overflow:hidden; }
.bar-fill{ height:100%; border-radius:8px; transition:width .4s ease; }

/* Badges */
.badge{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:var(--radius-pill); }
.badge-ai{ background:var(--amber-soft); color:var(--amber); }
.badge-verified{ background:var(--leaf-soft); color:var(--leaf-dark); }
.badge-low{ background:var(--danger-soft); color:var(--danger); }
.badge-source{ background:var(--card-tint); color:var(--ink-soft); }

/* Lists */
.list-item{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.list-item:last-child{ border-bottom:none; }
.thumb{ width:46px; height:46px; border-radius:var(--radius-sm); background:var(--card-tint); flex:none; object-fit:cover; display:flex; align-items:center; justify-content:center; font-size:19px; }
.item-title{ font-weight:700; font-size:14.5px; }
.item-sub{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }

/* Empty / loading / error states */
.empty-state{ text-align:center; padding:38px 20px; color:var(--ink-faint); }
.empty-state .icon{ font-size:32px; margin-bottom:10px; }
.empty-state h4{ color:var(--ink); font-family:var(--font-display); font-size:18px; margin:0 0 6px; }
.skeleton{ background:linear-gradient(90deg,var(--card-tint) 25%,var(--line) 37%,var(--card-tint) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:var(--radius-sm); }
@keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
.error-box{ background:var(--danger-soft); color:var(--danger); border-radius:var(--radius-md); padding:12px 14px; font-size:13.5px; font-weight:600; }

/* Toast */
#toast-host{ position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + 14px); display:flex; justify-content:center; z-index:80; pointer-events:none; }
.toast{ background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:var(--radius-pill); font-size:13.5px; font-weight:600; box-shadow:var(--shadow-md); animation:toastIn .25s ease; max-width:88%; text-align:center; }
@keyframes toastIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

/* Sheet / modal */
.sheet-backdrop{ position:fixed; inset:0; background:rgba(20,17,13,.45); z-index:90; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ width:100%; max-width:480px; background:var(--paper); border-radius:22px 22px 0 0; max-height:88vh; overflow-y:auto; padding:10px 16px calc(env(safe-area-inset-bottom,0) + 20px); animation:sheetUp .22s ease; }
@keyframes sheetUp{ from{transform:translateY(24px); opacity:.6;} to{transform:none; opacity:1;} }
.sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:4px; margin:8px auto 14px; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.sheet-head h3{ font-family:var(--font-display); font-size:19px; margin:0; font-weight:600; }
.modal-center{ position:fixed; inset:0; z-index:95; display:flex; align-items:center; justify-content:center; background:rgba(20,17,13,.45); padding:20px; }
.modal-card{ background:var(--card); border-radius:var(--radius-lg); padding:22px; max-width:400px; width:100%; text-align:center; }

/* Nutrition table */
.nutri-table{ width:100%; border-collapse:collapse; font-size:13px; }
.nutri-table td{ padding:7px 0; border-bottom:1px solid var(--line); }
.nutri-table td:last-child{ text-align:right; font-weight:700; }
.nutri-table tr.sub td:first-child{ padding-left:14px; color:var(--ink-faint); font-weight:400; }

/* Segmented control */
.segmented{ display:flex; background:var(--card-tint); border-radius:var(--radius-pill); padding:3px; gap:2px; }
.segmented button{ flex:1; border:none; background:none; padding:8px 4px; border-radius:var(--radius-pill); font-size:12.5px; font-weight:700; color:var(--ink-faint); cursor:pointer; }
.segmented button.active{ background:var(--card); color:var(--ink); box-shadow:var(--shadow-sm); }

/* Confidence bar */
.conf-track{ width:56px; height:5px; border-radius:4px; background:var(--card-tint); overflow:hidden; flex:none; }
.conf-fill{ height:100%; }

/* Camera */
.camera-frame{ position:relative; width:100%; aspect-ratio:3/4; border-radius:var(--radius-lg); overflow:hidden; background:#000; }
.camera-frame video, .camera-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
.camera-overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:18px; gap:12px; background:linear-gradient(0deg,rgba(0,0,0,.55),transparent 40%); }
.shutter{ width:66px; height:66px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.4); cursor:pointer; }
.analyzing-pulse{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:40px 20px; }
.pulse-ring{ width:64px; height:64px; border-radius:50%; border:3px solid var(--coral-soft); border-top-color:var(--coral); animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Chat */
.chat-scroll{ display:flex; flex-direction:column; gap:10px; padding-bottom:8px; }
.bubble{ max-width:82%; padding:11px 14px; border-radius:18px; font-size:14px; line-height:1.45; }
.bubble.user{ align-self:flex-end; background:var(--coral); color:#fff; border-bottom-right-radius:4px; }
.bubble.ai{ align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
.chat-suggest{ display:flex; flex-wrap:wrap; gap:7px; margin:2px 0 10px; }

/* misc */
.divider{ height:1px; background:var(--line); margin:14px 0; }
.link-btn{ background:none; border:none; color:var(--coral); font-weight:700; font-size:13.5px; cursor:pointer; padding:0; }
.kv{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.kv:last-child{ border-bottom:none; }
.kv .k{ color:var(--ink-faint); }
.kv .v{ font-weight:700; }
.progress-pill{ height:8px; border-radius:6px; background:var(--card-tint); overflow:hidden; }
.progress-pill > div{ height:100%; }
.onb-progress{ display:flex; gap:5px; padding:16px 16px 0; }
.onb-progress > div{ flex:1; height:4px; border-radius:3px; background:var(--line); }
.onb-progress > div.done{ background:var(--coral); }
.disclaimer{ font-size:11.5px; color:var(--ink-faint); line-height:1.5; padding:2px 2px; }
.switch{ position:relative; width:44px; height:26px; flex:none; }
.switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1; }
.switch .track{ position:absolute; inset:0; background:var(--line); border-radius:20px; transition:.15s; }
.switch .thumb{ position:absolute; top:3px; left:3px; width:20px; height:20px; background:#fff; border-radius:50%; transition:.15s; box-shadow:var(--shadow-sm); }
.switch input:checked + .track{ background:var(--leaf); }
.switch input:checked ~ .thumb{ transform:translateX(18px); }
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; }
.hero-num{ font-family:var(--font-display); font-weight:600; }
input:focus-visible, button:focus-visible, .choice:focus-visible, .chip:focus-visible{ outline:2px solid var(--coral); outline-offset:2px; }
@keyframes scanline {
  0% { top: 20%; opacity: 0.7; }
  50% { top: 80%; opacity: 1; }
  100% { top: 20%; opacity: 0.7; }
}
.barcode-laser {
  position: absolute;
  left: 12%;
  right: 12%;
  height: 2px;
  background: #ff3b30;
  box-shadow: 0 0 10px #ff3b30, 0 0 20px #ff3b30;
  animation: scanline 2.2s ease-in-out infinite;
  z-index: 10;
  pointer-events: none;
}
</style>
</head>

<script>
"use strict";
/* Point this at your running backend if it's not on localhost:4000 — e.g.
   window.NOURISH_API_BASE = "https://api.yourdomain.com/api"; (set this
   from a separate inline <script> tag placed BEFORE this one, or just edit
   the API_BASE default a few lines down). */
/* ============================================================
   NOURISH — constants & embedded reference nutrition data
   Values are approximate per-100g/ml reference figures (typical
   composition tables), used as the demo NutritionProvider.
   In production this module is swappable for a licensed API
   (USDA FoodData Central, Edamam, Nutritionix, etc.) — see
   NutritionProvider below.
   ============================================================ */
const MEAL_TYPES = ["Breakfast","Morning snack","Lunch","Evening snack","Dinner","Custom"];
const MEAL_ICON = {"Breakfast":"🌅","Morning snack":"🍎","Lunch":"🍛","Evening snack":"☕","Dinner":"🌙","Custom":"🍽️"};
const UNIT_GRAMS = { g:1, kg:1000, ml:1, l:1000, tsp:5, tbsp:15, cup:240, bowl:200, piece:null, slice:30, serving:null };
const HAND_PORTIONS = [
  { label: "✊ 1 Fist", desc: "Rice, pasta, fruit", grams: 180 },

  { label: "🤲 Cupped Hand", desc: "Nuts, snacks, granola", grams: 30 },
  { label: "👍 1 Thumb", desc: "Butter, oil, cheese", grams: 15 },
  { label: "🍽️ Half Plate", desc: "Mixed greens, salad", grams: 250 },
];
const ACTIVITY_LEVELS = [
  {id:"sedentary", label:"Sedentary", desc:"Little or no exercise", factor:1.2},
  {id:"light", label:"Lightly active", desc:"1–3 days/week", factor:1.375},
  {id:"moderate", label:"Moderately active", desc:"3–5 days/week", factor:1.55},
  {id:"active", label:"Very active", desc:"6–7 days/week", factor:1.725},
  {id:"athlete", label:"Athlete", desc:"Twice a day / physical job", factor:1.9},
];
const GOALS = [
  {id:"maintain", label:"Maintain weight", icon:"⚖️"},
  {id:"lose", label:"Weight loss", icon:"📉"},
  {id:"gain", label:"Weight gain", icon:"📈"},
  {id:"muscle", label:"Muscle building", icon:"💪"},
  {id:"general", label:"General nutrition", icon:"🥗"},
];
const DIET_PREFS = ["Non-vegetarian","Vegetarian","Vegan","Eggetarian","Pescatarian","Other"];
const CUISINES = ["Indian","Mediterranean","East Asian","Mexican","American","Continental","Middle Eastern","No preference"];
const COMMON_ALLERGIES = ["Peanuts","Tree nuts","Dairy","Eggs","Gluten","Soy","Shellfish","Fish","Sesame"];
const NOTIF_TYPES = [
  {id:"mealReminders", label:"Meal reminders", desc:"Breakfast, lunch, dinner, snacks"},
  {id:"hydration", label:"Hydration reminder", desc:"Reminders to log water"},
  {id:"loggingReminder", label:"Food logging reminder", desc:"Nudge if nothing logged by afternoon"},
  {id:"goalProgress", label:"Goal progress", desc:"Milestones on weight & macro goals"},
  {id:"dailyReport", label:"End-of-day report", desc:"Your report is ready"},
  {id:"weeklyReport", label:"Weekly report", desc:"Weekly summary is ready"},
];

// per100: {cal, p (protein g), c (carbs g), f (fat g), fib (fibre g), sug (sugar g), sat (sat fat g), sod (sodium mg)}

/* 7-Day Frictionless Trial Helpers */
function getTrialStartTime(){
  try{
    let ts = localStorage.getItem(TRIAL_START_KEY);
    if(!ts){
      ts = String(Date.now());
      localStorage.setItem(TRIAL_START_KEY, ts);
    }
    return parseInt(ts, 10) || Date.now();
  }catch(e){ return Date.now(); }
}
function getTrialDaysUsed(){
  const start = getTrialStartTime();
  return Math.max(0, Math.floor((Date.now() - start) / 86400000));
}
function getTrialDaysLeft(){
  return Math.max(0, 7 - getTrialDaysUsed());
}

  if(getAuthToken()) return false;

/** Central fetch wrapper: adds the auth header, parses JSON, and turns a
 * failed response into a thrown error shaped like { status, code, message }
 * so callers can branch on err.code the same way the AI error handling does. */
async function apiFetch(path, options){
  options = options || {};
  const headers = Object.assign({}, options.headers||{});
  const token = getAuthToken();
  if(token) headers["Authorization"] = "Bearer "+token;
  if(options.body && !(options.body instanceof FormData) && !headers["Content-Type"]){
    headers["Content-Type"] = "application/json";
  }
  let res;
  try{
    res = await fetch(API_BASE+path, Object.assign({}, options, {headers}));
  }catch(networkErr){
    if(networkErr && networkErr.name==="AbortError") throw { status:0, code:"cancelled", message:"Cancelled." };
    throw { status:0, code:"network_error", message:"Can't reach the Nourish server. Check API_BASE and that the backend is running." };
  }
  if(res.status===401){
    if(token){
      setAuthToken(null);
      STATE.auth = STATE.auth||{}; STATE.auth.loggedOut = true;
      throw { status:401, code:"unauthenticated", message:"Your session expired — please log in again." };
    } else {
      throw { status:401, code:"unauthenticated", message:"Please sign up or log in to sync this to the cloud." };
    }
  }
  if(res.status===204) return null;
  const isJson = (res.headers.get("content-type")||"").includes("application/json");
  const body = isJson ? await res.json().catch(()=>null) : await res.text().catch(()=>null);
  if(!res.ok){
    const err = (body && body.error) || {};
    throw { status:res.status, code:err.code||"request_failed", message:err.message||"Something went wrong talking to the server.", details:err.details };
  }
  return body;
}
async function apiGet(path){ return apiFetch(path, {method:"GET"}); }
async function apiPost(path, data, signal){ return apiFetch(path, {method:"POST", body: data!==undefined?JSON.stringify(data):undefined, signal}); }
async function apiPut(path, data){ return apiFetch(path, {method:"PUT", body: data!==undefined?JSON.stringify(data):undefined}); }
async function apiDelete(path){ return apiFetch(path, {method:"DELETE"}); }
async function apiUpload(path, formData, signal){ return apiFetch(path, {method:"POST", body:formData, signal}); }

/* Client-Side Image Resizer & Compressor */
function compressImage(fileOrBlob, maxDim = 1280, quality = 0.85){
  return new Promise((resolve) => {
    try {
      const img = new Image();
      const url = URL.createObjectURL(fileOrBlob);
      img.onload = () => {
        try {
          URL.revokeObjectURL(url);
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            resolve(blob || fileOrBlob);
          }, "image/jpeg", quality);
        } catch(e) {
          resolve(fileOrBlob);
        }
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        resolve(fileOrBlob);
      };
      img.src = url;
    } catch(e) {
      resolve(fileOrBlob);
    }
  });
}

   UNIT CONVERSION + MACRO MATH
   ============================================================ */
function unitToGrams(food, qty, unit){
  if(unit==="piece" || unit==="serving"){
    const base = food.serving && (food.serving.unit===unit || unit==="serving") ? food.serving.grams : (food.serving?food.serving.grams:100);
    const baseQty = food.serving?food.serving.qty:1;
    return (qty/ (baseQty||1)) * base;
  }
  if(unit==="slice" && food.serving && food.serving.unit==="slice"){
    return (qty/(food.serving.qty||1)) * food.serving.grams;
  }
  if(unit==="bowl" && food.serving && food.serving.unit==="bowl"){
    return (qty/(food.serving.qty||1)) * food.serving.grams;
  }
  const g = UNIT_GRAMS[unit];
  if(g==null) return qty * (food.serving?food.serving.grams/food.serving.qty:100);
  return qty*g;
}
function macrosForGrams(food, grams){
  const f = (grams||0)/100;
  const p100 = (food && food.per100) || {};
  const cal = p100.cal != null ? p100.cal : (p100.calories != null ? p100.calories : 0);
  const p = p100.p != null ? p100.p : (p100.proteinG != null ? p100.proteinG : (p100.protein != null ? p100.protein : 0));
  const c = p100.c != null ? p100.c : (p100.carbsG != null ? p100.carbsG : (p100.carbs != null ? p100.carbs : 0));
  const fat = p100.f != null ? p100.f : (p100.fatG != null ? p100.fatG : (p100.fat != null ? p100.fat : 0));
  const fib = p100.fib != null ? p100.fib : (p100.fibreG != null ? p100.fibreG : (p100.fibre != null ? p100.fibre : 0));
  const sug = p100.sug != null ? p100.sug : (p100.sugarG != null ? p100.sugarG : (p100.sugar != null ? p100.sugar : 0));
  const sat = p100.sat != null ? p100.sat : (p100.satFatG != null ? p100.satFatG : (p100.satFat != null ? p100.satFat : 0));
  const sod = p100.sod != null ? p100.sod : (p100.sodiumMg != null ? p100.sodiumMg : (p100.sodium != null ? p100.sodium : 0));
  return {
    cal: cal * f, p: p * f, c: c * f, fat: fat * f,
    fib: fib * f, sug: sug * f, sat: sat * f, sod: sod * f,
  };
}
function macrosForQty(food, qty, unit){ return macrosForGrams(food, unitToGrams(food, qty, unit)); }
function sumMacros(items){
  const t = {cal:0,p:0,c:0,fat:0,fib:0,sug:0,sat:0,sod:0};
  items.forEach(it=>{ const m=it.macros||it; t.cal+=m.cal||0; t.p+=m.p||0; t.c+=m.c||0; t.fat+=m.fat||0; t.fib+=m.fib||0; t.sug+=m.sug||0; t.sat+=m.sat||0; t.sod+=m.sod||0; });
  return t;
}
function unitOptions(food){
  const opts = ["g","serving","piece","bowl","cup","tbsp","tsp","slice","ml"];
  if(!food) return ["g","serving"];
  const set = new Set(["g", food.serving?food.serving.unit:"serving"]);
  if(food.per100 && food.cat==="Beverages") set.add("ml").add("cup");
  return Array.from(set);
}

/* ============================================================
   GOAL CALCULATION ENGINE (Mifflin-St Jeor) — configurable,
   always overridable by the user. Not medical advice.
   ============================================================ */
function calcBMR(profile){
  const {weightKg, heightCm, age, gender} = profile;
  if(!weightKg || !heightCm || !age) return null;
  let bmr = 10*weightKg + 6.25*heightCm - 5*age;
  bmr += (gender==="male") ? 5 : (gender==="female" ? -161 : -78);
  return bmr;
}
function calcTargets(profile){
  const bmr = calcBMR(profile);
  if(!bmr) return null;
  const act = ACTIVITY_LEVELS.find(a=>a.id===profile.activityLevel) || ACTIVITY_LEVELS[1];
  let tdee = bmr*act.factor;
  const goalAdj = {maintain:0, lose:-450, gain:400, muscle:250, general:0}[profile.goal] || 0;
  let calories = Math.round(tdee+goalAdj);
  calories = clamp(calories, 1200, 4500);
  const proteinPerKg = {lose:1.8, muscle:1.9, gain:1.7, maintain:1.4, general:1.3}[profile.goal] || 1.4;
  const protein = Math.round(proteinPerKg*(profile.weightKg||70));
  const fat = Math.round((calories*0.27)/9);
  const proteinCal = protein*4, fatCal = fat*9;
  const carbs = Math.max(50, Math.round((calories-proteinCal-fatCal)/4));
  const fibre = Math.round(calories/1000*14);
  return {calories, protein, carbs, fat, fibre};
}

/* ============================================================
   FRONTEND <-> BACKEND SHAPE TRANSLATION
   The rest of this app (every render/business-logic function below) was
   written against a generic doc/collection store and a {cal,p,c,fat,fib,...}
   macro shape. The backend speaks specific REST resources and
   {calories,proteinG,carbsG,fatG,fibreG,...} field names. These functions
   are the ONLY place that difference is bridged, so nothing else had to
   change to run against a real database.
   ============================================================ */
function beMacrosToFe(m){
  if(!m) return {cal:0,p:0,c:0,fat:0,fib:0,sug:0,sat:0,sod:0};
  return {cal:m.calories||0, p:m.proteinG||0, c:m.carbsG||0, fat:m.fatG||0, fib:m.fibreG||0, sug:m.sugarG||0, sat:m.satFatG||0, sod:m.sodiumMg||0};
}
function feItemToBe(it){
  const out = {name:it.name, qty:it.qty, unit:it.unit, source:it.source||"manual"};
  if(it.confidence!=null) out.confidence = it.confidence;
  if(it.foodId){ out.foodId = it.foodId; }
  const m = it.macros||{};
  out.calories = Math.round(m.cal||0);
  out.proteinG = round1(m.p||0);
  out.carbsG = round1(m.c||0);
  out.fatG = round1(m.fat||0);
  out.fibreG = round1(m.fib||0);
  out.sugarG = round1(m.sug||0);
  out.satFatG = round1(m.sat||0);
  out.sodiumMg = Math.round(m.sod||0);
  return out;
}
function beItemToFe(it){
  return {foodId:it.foodId||null, name:it.name, qty:it.qty, unit:it.unit, macros:beMacrosToFe(it), source:it.source, confidence:it.confidence!=null?it.confidence:null};
}
function beMealToFe(m){
  const items = (m.items||[]).map(beItemToFe);
  return {id:m.id, date:(m.date||"").slice(0,10), time:m.time||"", mealType:m.mealType, items,
    totals:sumMacros(items.map(i=>i.macros)), source:m.source, note:m.note||"",
    imageAssetId:null, imageUrl:m.imageAssetUrl||null, createdAt: m.createdAt? new Date(m.createdAt).getTime() : Date.now()};
}
function feMealToBeBody(m){
  return {date:m.date, time:m.time||undefined, mealType:m.mealType, source:m.source||"manual", note:m.note||undefined,
    imageAssetUrl:m.imageUrl||undefined, items:(m.items||[]).map(feItemToBe)};
}
function beWeightToFe(w){ return {id:w.id, date:(w.date||"").slice(0,10), weight:w.weightKg, note:w.note||""}; }
function beRecipeToFe(r){
  const t = r.totals||{calories:0,proteinG:0,carbsG:0,fatG:0,fibreG:0};
  return {id:r.id, name:r.name, servings:r.servings, ingredients:[], totals:beMacrosToFe(t)};
}
function beNotifToFe(n){ return {id:n.id, type:n.type, title:n.title, body:n.body, read:n.read, createdAt:new Date(n.createdAt).getTime()}; }
function beFoodToFe(f){
  const n = (f && f.nutrients) || {};
  const servings = (f && f.servings) || [];
  return {id:f.id, name:f.name, cat:f.category, isProduct:f.isProduct, custom:f.isCustom,
    per100:{cal:n.calories||0, p:n.proteinG||0, c:n.carbsG||0, f:n.fatG||0, fib:n.fibreG||0, sug:n.sugarG||0, sat:n.satFatG||0, sod:n.sodiumMg||0},
    serving: servings[0] || {qty:1, unit:"serving", grams:100, label:"1 serving"}};

/* ============================================================
   STORAGE SERVICE — same method names the rest of the app calls
   (getDoc/setDoc/listCollection/...), now backed by real REST calls to the
   Nourish backend instead of a generic document store. Falls back to a
   per-device localStorage cache only when the backend is unreachable, so
   the UI degrades gracefully rather than breaking outright.
   ============================================================ */
const LOCAL_FALLBACK_KEY = "nourish_fallback_store_v1";
const LocalFallback = { store: {} };
function loadLocalFallback(){
  try{ const raw = localStorage.getItem(LOCAL_FALLBACK_KEY); if(raw) LocalFallback.store = JSON.parse(raw)||{}; }
  catch(e){ console.warn("localStorage read failed", e); }
}
function saveLocalFallback(){
  try{ localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(LocalFallback.store)); }
  catch(e){ console.warn("localStorage write failed (storage full or unavailable)", e); }
}

const StorageService = {
  async getDoc(path){
    if(!getAuthToken()){
      return LocalFallback.store[path] || null;
    }
    try{
      if(path==="profile/main"){
        const {profile, goals} = await apiGet("/profile");
        if(!profile) return LocalFallback.store[path] || null;
        const tg = goals ? {calories:goals.calories, protein:goals.proteinG, carbs:goals.carbsG, fat:goals.fatG, fibre:goals.fibreG} : ((LocalFallback.store[path] && LocalFallback.store[path].targets) || {calories:2000, protein:120, carbs:220, fat:65, fibre:30});
        const res = Object.assign({}, profile, {targets: tg});
        LocalFallback.store[path] = res; saveLocalFallback();
        return res;
      }
      if(path==="settings/main"){
        const [{profile}, {preferences}] = await Promise.all([apiGet("/profile"), apiGet("/notifications/preferences")]);
        if(!profile) return LocalFallback.store[path] || null;
        const notifPrefs = {};
        (preferences||[]).forEach(p=>{ notifPrefs[p.type] = p.enabled; });
        const res = {reportTime:profile.reportTime, units:profile.units, appearance:profile.appearance, aiEnabled:profile.aiEnabled, waterGoalMl:profile.waterGoalMl, notifPrefs};
        LocalFallback.store[path] = res; saveLocalFallback();
        return res;
      }
    }catch(e){ console.warn("getDoc fallback to local", path, e); return LocalFallback.store[path]||null; }
    return LocalFallback.store[path]||null;
  },
  async setDoc(path, data){
    LocalFallback.store[path] = data; saveLocalFallback();
    if(!getAuthToken()) return true;
    try{
      if(path==="profile/main"){
        const {targets, ...rest} = data;
        await apiPut("/profile", rest);
        if(targets) await apiPut("/profile/goals", {calories:targets.calories, proteinG:targets.protein, carbsG:targets.carbs, fatG:targets.fat, fibreG:targets.fibre});
        return true;
      }
      if(path==="settings/main"){
        const {notifPrefs, ...rest} = data;
        await apiPut("/profile", rest);
        if(notifPrefs) await Promise.all(Object.entries(notifPrefs).map(([type,enabled])=>apiPut("/notifications/preferences", {type, enabled})));
        return true;
      }
    }catch(e){ console.warn("setDoc failed", path, e); }
    return true;
  },
  async updateDoc(path, data){ return this.setDoc(path, data); },
  async deleteDoc(path){
    if(path==="profile/main" && getAuthToken()){
      try{ await apiDelete("/auth/me"); }catch(e){ console.warn(e); }
      setAuthToken(null);
    }
    delete LocalFallback.store[path]; saveLocalFallback();
  },
  async listCollection(path){
    if(!getAuthToken()){
      return Object.keys(LocalFallback.store).filter(k=>k.startsWith(path+"/")).map(k=>LocalFallback.store[k]);
    }
    try{
      if(path==="meals"){ const {meals} = await apiGet("/meals"); return meals.map(beMealToFe); }
      if(path==="weight_logs"){ const {logs} = await apiGet("/weight"); return logs.map(beWeightToFe); }
      if(path==="recipes"){ const {recipes} = await apiGet("/recipes"); return recipes.map(beRecipeToFe); }
      if(path==="favorites"){ const {favorites} = await apiGet("/favorites"); return favorites.map(f=>Object.assign({}, f, f.snapshot||{})); }
      if(path==="notifications"){ const {notifications} = await apiGet("/notifications"); return notifications.map(beNotifToFe); }
      if(path==="custom_foods"){ const {foods} = await apiGet("/foods/custom"); return foods.map(beFoodToFe); }
    }catch(e){ console.warn("listCollection failed, using local", path, e); }
    return Object.keys(LocalFallback.store).filter(k=>k.startsWith(path+"/")).map(k=>LocalFallback.store[k]);
  },
  async addToCollection(path, data){
    const id = data.id || uid();
    const item = Object.assign({id}, data);
    LocalFallback.store[path+"/"+id] = item;
    saveLocalFallback();
    if(!getAuthToken()) return id;
    try{
      if(path==="meals"){ const {meal} = await apiPost("/meals", feMealToBeBody(data)); return meal.id; }
      if(path==="weight_logs"){ const {log} = await apiPost("/weight", {date:data.date, weightKg:data.weight, note:data.note}); return log.id; }
      if(path==="recipes"){
        const ingredients = (data.ingredients||[]).map(i=>({foodId:i.foodId, qty:i.qty, unit:i.unit}));
        const {recipe} = await apiPost("/recipes", {name:data.name, servings:data.servings, ingredients});
        return recipe.id;
      }
      if(path==="favorites"){
        const {type, refId, name} = data;
        const snapshot = Object.assign({}, data); delete snapshot.type; delete snapshot.refId; delete snapshot.name; delete snapshot.createdAt;
        const {favorite} = await apiPost("/favorites", {type, refId:String(refId), name, snapshot});
        return favorite.id;
      }
      if(path==="notifications"){ return null; }
    }catch(e){ console.warn("addToCollection server call failed", path, e); }
    return id;
  },
  async setInCollection(path, id, data){
    LocalFallback.store[path+"/"+id] = Object.assign({id}, data);
    saveLocalFallback();
    if(!getAuthToken()) return;
    try{
      if(path==="meals"){ await apiPut(`/meals/${id}`, feMealToBeBody(data)); return; }
      if(path==="weight_logs"){ await apiPost("/weight", {date:data.date, weightKg:data.weight, note:data.note}); return; }
    }catch(e){ console.warn(e); }
  },
  async deleteFromCollection(path, id){
    delete LocalFallback.store[path+"/"+id];
    saveLocalFallback();
    if(!getAuthToken()) return;
    try{
      if(path==="meals"){ await apiDelete(`/meals/${id}`); return; }
      if(path==="recipes"){ await apiDelete(`/recipes/${id}`); return; }
      if(path==="favorites"){ await apiDelete(`/favorites/${id}`); return; }
      if(path==="notifications"){ await apiDelete(`/notifications/${id}`); return; }
    }catch(e){ console.warn(e); }
  },
};
/* ============================================================
   AI SERVICE LAYER — every call goes through the backend's /ai/* routes,
   which hold the actual prompts and call the real Anthropic SDK server-side
   (see backend/src/services/ai/). The functions below keep the exact same
   names/signatures/return shapes ({ok,data,message} / {ok,text,message})
   the rest of this app already calls, so no render/business-logic code
   elsewhere had to change.
   ============================================================ */
function aiErrorMessage(e){
  const map = {
    ai_not_configured: "AI features aren't configured on this server yet (no API key set).",
    ai_disabled: "AI features are turned off in Settings.",
    rate_limited: "You've made a lot of AI requests — please wait a moment and try again.",
    unsupported_file_type: "Please use a JPEG, PNG, WebP or GIF image.",
    missing_file: "No image was received — please try again.",
    upload_error: "That image couldn't be uploaded. Try a smaller photo.",
    invalid_json: "The AI's response wasn't understood — please try again.",
    empty_completion: "The AI didn't return a result — please try again.",
    no_data: "Log at least one meal on this date first.",
    insufficient_data: "Log a few more days to unlock trend insights.",
    network_error: "Can't reach the Nourish server — check that the backend is running.",
    unauthenticated: "Your session expired — please log in again.",
    invalid_request: "That request wasn't valid — please try again.",
    db_unavailable: "Cloud database offline. Your entries are saved safely on your device in 7-Day Guest Mode.",
  };
  return (e && map[e.code]) || (e && e.message) || "Something went wrong with the AI request. Please try again.";
}
async function callAiJson(path, body, signal){
  try{ const data = await apiPost(path, body, signal); return {ok:true, data}; }
  catch(e){ return {ok:false, code:e.code, message:aiErrorMessage(e)}; }
}
async function callAiMultipart(path, formData, signal){
  try{ const data = await apiUpload(path, formData, signal); return {ok:true, data}; }
  catch(e){ return {ok:false, code:e.code, message:aiErrorMessage(e)}; }
}

/* ============================================================
   SVG CHART HELPERS (self-contained, theme-aware via CSS vars)
   ============================================================ */
function svgRing(pct, colorVar, size){
  size = size||172; const r=size*0.42, c=2*Math.PI*r, cx=size/2, cy=size/2;
  const off = c*(1-clamp(pct,0,1));
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--card-tint)" stroke-width="14"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(${colorVar})" stroke-width="14" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset .5s ease"/>
  </svg>`;
}
function svgBarChart(labels, series, opts){
  opts = opts||{}; const w=opts.w||420, h=opts.h||160, pad={l:28,r:8,t:10,b:22};
  const max = Math.max(1, ...series.map(s=>Math.max(...s.data,0)));
  const innerW = w-pad.l-pad.r, innerH = h-pad.t-pad.b;
  const groupW = innerW/labels.length;
  const barW = Math.min(18, groupW/(series.length+1.3));
  let bars="", gridlines="";
  for(let g=0; g<4; g++){ const y=pad.t+innerH*g/4; gridlines += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }
  labels.forEach((lab,i)=>{
    const gx = pad.l + i*groupW + groupW/2 - (series.length*barW)/2;
    series.forEach((s,si)=>{
      const v = s.data[i]||0; const bh = innerH*(v/max); const x = gx+si*barW;
      bars += `<rect x="${x}" y="${pad.t+innerH-bh}" width="${barW-3}" height="${Math.max(bh,1)}" rx="3" fill="${s.color}"/>`;
    });
    bars += `<text x="${pad.l+i*groupW+groupW/2}" y="${h-5}" font-size="9.5" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--font-ui)">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${gridlines}${bars}</svg>`;
}
function svgLineChart(points, opts){
  opts=opts||{}; const w=opts.w||420, h=opts.h||150, pad={l:32,r:12,t:14,b:20};
  if(points.length===0) return `<div class="empty-state small">No data yet</div>`;
  const xs = points.map(p=>p.x), ys=points.map(p=>p.y);
  const minY = opts.minY!=null?opts.minY:Math.min(...ys), maxY = opts.maxY!=null?opts.maxY:Math.max(...ys);
  const spanY = (maxY-minY)||1;
  const innerW=w-pad.l-pad.r, innerH=h-pad.t-pad.b;
  const X = i => pad.l + innerW*(i/(Math.max(points.length-1,1)));
  const Y = v => pad.t + innerH*(1-(v-minY)/spanY);
  let d = points.map((p,i)=>`${i===0?"M":"L"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
  const area = d + ` L${X(points.length-1).toFixed(1)},${pad.t+innerH} L${X(0).toFixed(1)},${pad.t+innerH} Z`;
  let grid=""; for(let g=0; g<3; g++){ const y=pad.t+innerH*g/2; grid+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }
  const dots = points.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" fill="${opts.color||'var(--coral)'}"/>`).join("");
  const labelEvery = Math.ceil(points.length/5)||1;
  const xlabels = points.map((p,i)=> (i%labelEvery===0||i===points.length-1) ? `<text x="${X(i).toFixed(1)}" y="${h-4}" font-size="9" fill="var(--ink-faint)" text-anchor="middle" font-family="var(--font-ui)">${esc(p.label||"")}</text>` : "").join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">${grid}
    <path d="${area}" fill="${opts.fill||'var(--coral-soft)'}" opacity=".55"/>
    <path d="${d}" fill="none" stroke="${opts.color||'var(--coral)'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlabels}</svg>`;
}
function svgDonut(segments, size){
  size=size||140; const r=size*0.38, cx=size/2, cy=size/2, c=2*Math.PI*r;
  const total = segments.reduce((a,s)=>a+s.value,0)||1;
  let offset=0, paths="";
  segments.forEach(s=>{
    const frac = s.value/total; const len = c*frac;
    paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
}

}
function confBadge(conf){
  if(conf==null) return "";
  const pct = Math.round(conf*100);
  const cls = conf>=0.75?"badge-verified":(conf>=0.5?"badge-ai":"badge-low");
  const txt = conf>=0.75?"High confidence":(conf>=0.5?"Medium confidence":"Low — please verify");
  return `<span class="badge ${cls}">${txt} · ${pct}%</span>`;
}

  const label = {ai_image:"📷 AI photo", manual:"✏️ Manual", voice:"🎙️ Voice", ocr:"🏷️ Label scan", saved:"⭐ Saved meal", ai_suggestion:"✨ AI suggested"}[source]||source;
  return `<span class="badge badge-source">${label}</span>`;
}
function macroChipsRow(m){
  // Normalize both frontend {cal,p,c,fat} and AI response {calories,protein,carbs,fat} formats
  const cal = m.cal != null ? m.cal : (m.calories != null ? m.calories : 0);
  const prot = m.p != null ? m.p : (m.protein != null ? m.protein : 0);
  const carb = m.c != null ? m.c : (m.carbs != null ? m.carbs : 0);
  const fat = m.fat != null ? m.fat : 0;
  const fib = m.fib != null ? m.fib : (m.fibre != null ? m.fibre : 0);
  return `<div class="chip-row small">
    <span class="chip" style="cursor:default">🔥 ${Math.round(cal)} kcal</span>
    <span class="chip" style="cursor:default">P ${round1(prot)}g</span>
    <span class="chip" style="cursor:default">C ${round1(carb)}g</span>
    <span class="chip" style="cursor:default">F ${round1(fat)}g</span>
    ${fib > 0 ? `<span class="chip" style="cursor:default">Fib ${round1(fib)}g</span>` : ''}
  </div>`;
}

function render(){
  const app = document.getElementById("app");
  if(STATE.bootError){
    app.innerHTML = `<div class="screen" style="padding-top:60px"><div class="empty-state"><div class="icon">⚠️</div><h4>Couldn't load Nourish</h4><p>${esc(STATE.bootError)}</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div></div>`;
    return;
  }
  if(!STATE.ready){
    app.innerHTML = `<div class="screen" style="padding-top:80px"><div class="analyzing-pulse"><div class="pulse-ring"></div><div class="muted">Loading your nutrition data…</div></div></div>`;
    return;
  }
  if((!getAuthToken() && isTrialExpired()) || (STATE.auth && STATE.auth.loggedOut) || STATE.showAuthModal){
    app.innerHTML = renderAuthScreen();
    return;
  }
  if(!STATE.profile || !STATE.profile.targets){
    app.innerHTML = renderOnboarding();
    afterRenderOnboarding();
    return;
  }
  let html = renderTopbar() + renderRoute();
  app.innerHTML = html;
  if(STATE.route!=="onboarding"){
    const tb = document.createElement("div"); tb.innerHTML = renderTabbar();
    app.appendChild(tb.firstElementChild);
  }
  if(STATE.sheet){ renderSheetOverlay(); }
  if(STATE.modal){ renderModalOverlay(); }
  afterRender();
}

async function loadMealsForDate(dateStr){
  STATE.loading.meals = true;
  try{
    let list = [];
    if(getAuthToken()){
      try{
        const {meals} = await apiGet(`/meals?date=${encodeURIComponent(dateStr)}`);
        list = meals.map(beMealToFe);
      }catch(e){
        console.warn("loadMealsForDate server failed, falling back to local", e);
        list = Object.keys(LocalFallback.store)
          .filter(k=>k.startsWith("meals/"))
          .map(k=>LocalFallback.store[k])
          .filter(m=>m && m.date===dateStr);
      }
    } else {
      list = Object.keys(LocalFallback.store)
        .filter(k=>k.startsWith("meals/"))
        .map(k=>LocalFallback.store[k])
        .filter(m=>m && m.date===dateStr);
    }
    list.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    STATE.todaysMeals = list;
    const w = await getWaterForDate(dateStr);
    STATE.todaysWaterMl = w;
  } finally { STATE.loading.meals=false; }
}
async function getWaterForDate(dateStr){
  if(getAuthToken()){
    try{ const {totalMl} = await apiGet(`/water?date=${encodeURIComponent(dateStr)}`); return totalMl||0; }
    catch(e){ return LocalFallback.store[`water/${dateStr}`]||0; }
  }
  return LocalFallback.store[`water/${dateStr}`]||0;
}
async function logWater(amountMl){
  if(getAuthToken()){
    try{ await apiPost("/water", {date:STATE.selectedDate, amountMl}); }
    catch(e){ console.warn(e); }
  } else {
    LocalFallback.store[`water/${STATE.selectedDate}`] = (LocalFallback.store[`water/${STATE.selectedDate}`]||0) + amountMl;
    saveLocalFallback();
  }
  STATE.todaysWaterMl = (STATE.todaysWaterMl||0)+amountMl;
  render();
  toast(`+${amountMl}ml logged`);
}

function computeLoggingStreak(){
  const mealDates = new Set((STATE._allMealsCache||[]).map(m=>m.date));
  let streak = 0;
  let cursor = todayStr();
  // Today not logged yet doesn't break a streak still in progress.
  if(!mealDates.has(cursor)) cursor = addDays(cursor,-1);
  while(mealDates.has(cursor)){ streak++; cursor = addDays(cursor,-1); }
  return streak;
}

function suggestMealType(){
  const h = new Date().getHours();
  if(h<11) return "Breakfast"; if(h<12) return "Morning snack"; if(h<16) return "Lunch"; if(h<19) return "Evening snack"; return "Dinner";
}
function searchFoods(q){
  q = (q||"").trim().toLowerCase();
  if(!q) return [];
  const words = q.split(/\s+/).filter(Boolean);
  const all = allFoodsSearchable();
  const scored = [];
  for(const f of all){
    const name = f.name.toLowerCase();
    const cat = (f.cat||"").toLowerCase();
    let score = 0;
    if(name===q) score += 100;
    else if(name.startsWith(q)) score += 60;
    else if(name.includes(q)) score += 40;
    let allWordsMatch = true;
    for(const w of words){
      if(name.includes(w)) score += 12;
      else if(cat.includes(w)) score += 5;
      else allWordsMatch = false;
    }
    if(allWordsMatch && words.length>1) score += 15; // multi-word query, every word found somewhere
    if(score>0) scored.push({f, score});
  }
  scored.sort((a,b)=> b.score-a.score || a.f.name.length-b.f.name.length);
  return scored.slice(0,25).map(s=>s.f);
}

function freshScanState(){ return {status:"idle", blob:null, previewUrl:null, items:[], notes:"", mealType:suggestMealType(), error:null}; }
async function lookupBarcode(code){
  const clean = String(code||"").trim();
  if(!clean){ toast("Please enter a barcode number"); return; }
  toast("Looking up product…");
  try{
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(clean)}.json`);
    const data = await res.json();
    if(data.status !== 1 || !data.product){
      toast("Product not found in Open Food Facts database.");
      return;
    }
    const p = data.product;
    const n = p.nutriments || {};
    const name = p.product_name || p.generic_name || "Packaged Product";
    const cal = Math.round(n["energy-kcal_100g"] || (n["energy_100g"] ? n["energy_100g"]/4.184 : 0));
    const protein = round1(n.proteins_100g || 0);
    const carbs = round1(n.carbohydrates_100g || 0);
    const fat = round1(n.fat_100g || 0);
    const fibre = round1(n.fiber_100g || 0);
    const servingGrams = parseFloat(p.serving_quantity) || 100;
    const factor = servingGrams / 100;
    const item = {
      name: name + (p.brands ? ` (${p.brands})` : ""),
      portionGrams: servingGrams,
      portionEstimate: p.serving_size || `${servingGrams}g`,
      confidence: 0.98,
      macros: {
        cal: Math.round(cal * factor),
        p: round1(protein * factor),
        c: round1(carbs * factor),
        fat: round1(fat * factor),
        fib: round1(fibre * factor),
        sug: round1((n.sugars_100g || 0) * factor),
        sat: round1((n["saturated-fat_100g"] || 0) * factor),
        sod: round1((n.sodium_100g ? n.sodium_100g * 1000 : 0) * factor),
      }
    };
    STATE.scan.status = "results";
    STATE.scan.previewUrl = p.image_url || p.image_front_url || "";
    STATE.scan.notes = `Barcode: ${clean} · ${p.brands || ""}`;
    STATE.scan.items = [item];
    render();
    toast(`Found: ${name}`);
  }catch(e){
    console.warn("Barcode lookup failed", e);
    toast("Network error looking up barcode.");
  }
}

async function startBarcodeCameraScan(){
  STATE.barcodeScanActive = true;
  STATE.scanTab = "barcode";
  await startCameraMode();
  if('BarcodeDetector' in window){
    try{
      const detector = new BarcodeDetector({formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'qr_code', 'code_128']});
      const loop = async () => {
        if(!STATE.barcodeScanActive || !STATE.cameraActive) return;
        const v = document.getElementById("scan-video");
        if(v && v.readyState >= 2){
          try{
            const codes = await detector.detect(v);
            if(codes && codes.length > 0){
              const code = codes[0].rawValue;
              stopLiveCamera();
              STATE.barcodeScanActive = false;
              STATE.cameraActive = false;
              lookupBarcode(code);
              return;
            }
          }catch(e){}
        }
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }catch(err){
      console.warn("BarcodeDetector error", err);
    }
  }
}

function quickAdjustScanPortion(idx, delta){
  const it = STATE.scan.items[idx];
  if(!it) return;
  const cur = it.portionGrams || 100;
  const next = Math.max(10, Math.round(cur + delta));
  scaleScanItem(idx, next);
}

function scaleScanItem(idx, newGrams){
  const it = STATE.scan.items[idx]; if(!it.portionGrams) it.portionGrams=newGrams||1;
  const f = newGrams/(it.portionGrams||1);
  it.macros = {cal:it.macros.cal*f, p:it.macros.p*f, c:it.macros.c*f, fat:it.macros.fat*f, fib:it.macros.fib*f, sug:0,sat:0,sod:0};
  it.portionGrams = newGrams; it.portionEstimate = `${Math.round(newGrams)} g`; it.confidence = it.confidence; render();
}

async function handleScanFile(evt){
  const file = evt.target.files && evt.target.files[0]; if(!file) return;
  stopLiveCamera();
  STATE.cameraActive = false;
  STATE.scan = freshScanState();
  STATE.scan.status = "analyzing";
  STATE.scan.previewUrl = URL.createObjectURL(file);
  render();
  try {
    const compressed = await compressImage(file, 1280, 0.85);
    STATE.scan.blob = compressed;
    if(compressed !== file){
      URL.revokeObjectURL(STATE.scan.previewUrl);
      STATE.scan.previewUrl = URL.createObjectURL(compressed);
    }
  } catch(e) {
    STATE.scan.blob = file;
  }
  await runScanAnalysis();
}
async function retryScan(){ STATE.scan.status="analyzing"; render(); await runScanAnalysis(); }
function cancelScan(){
  stopLiveCamera();
  STATE.cameraActive = false;
  if(STATE.scan._abortCtl){ try{ STATE.scan._abortCtl.abort(); }catch(e){} }
  STATE.scan.status="idle"; STATE.scan.blob=null; STATE.scan.previewUrl=null;
  render();
}
async function runScanAnalysis(){
  const ctl = new AbortController();
  STATE.scan._abortCtl = ctl;
  const res = await FoodRecognitionService.analyze(STATE.scan.blob, "", ctl.signal);
  if(STATE.scan.status!=="analyzing") return; // cancelled or navigated away mid-call
  if(!res.ok){
    if(res.code==="cancelled") return;
    STATE.scan.status="error"; STATE.scan.error=res.message; render(); return;
  }
  const items = (res.data.items||[]).map(it=>({
    name:it.name, portionEstimate:it.portionEstimate, portionGrams:it.portionGrams||100,
    macros:{cal:it.calories||0, p:it.protein||0, c:it.carbs||0, fat:it.fat||0, fib:it.fibre||0, sug:0, sat:0, sod:0},
    confidence: typeof it.confidence==="number" ? it.confidence : 0.6,
  }));
  // The backend both analyzed AND stored the photo in this one call — keep
  // its persisted URL so the saved meal still shows the image after reload.
  if(res.data.imageUrl){ const origin = API_BASE.replace(/\/api\/?$/,""); STATE.scan.serverImageUrl = origin + res.data.imageUrl; }
  if(!items.length){ STATE.scan.status="error"; STATE.scan.error = res.data.notes || "No food could be identified in that photo. Try a clearer, well-lit photo, or log manually."; render(); return; }
  STATE.scan.items = items; STATE.scan.notes = res.data.notes||""; STATE.scan.status="results"; render();
}
async function saveScanMeal(){

    items:s.items.map(i=>({foodId:i.foodId||null,name:i.name,qty:Math.round(i.portionGrams),unit:"g",macros:i.macros,source:"ai_image",confidence:i.confidence})),

  STATE.scan = freshScanState();
  await loadMealsForDate(STATE.selectedDate); await refreshAllMealsCache();
  await checkGoalNotifications();
  goTo("home");
}

function toggleVoiceListen(){

  if(v.listening){ STATE._recognition && STATE._recognition.stop(); v.listening=false; render(); return; }
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  const rec = new SR(); rec.continuous=true; rec.interimResults=true; rec.lang="en-US";
  rec.onresult = (e)=>{ let txt=""; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript+" "; STATE.voice.transcript=txt.trim(); render(); };
  rec.onerror = ()=>{ STATE.voice.listening=false; render(); };
  rec.onend = ()=>{ STATE.voice.listening=false; render(); };
  STATE._recognition = rec; v.listening=true; render(); rec.start();
}

function cancelOcr(){
  if(STATE.ocr._abortCtl){ try{ STATE.ocr._abortCtl.abort(); }catch(e){} }
  STATE.ocr.status="idle"; STATE.ocr.blob=null; STATE.ocr.previewUrl=null;
  refreshSheet();
}
async function handleOcrFile(evt){
  const file = evt.target.files && evt.target.files[0]; if(!file) return;
  STATE.ocr.blob = file; STATE.ocr.previewUrl = URL.createObjectURL(file); STATE.ocr.status = "analyzing"; refreshSheet();
  const ctl = new AbortController();
  STATE.ocr._abortCtl = ctl;
  let uploadBlob = file;
  try {
    uploadBlob = await compressImage(file, 1280, 0.85);
  } catch(e) {}
  const res = await OCRService.extract(uploadBlob, ctl.signal);
  if(STATE.ocr.status!=="analyzing") return;
  if(!res.ok){
    if(res.code==="cancelled") return;
    STATE.ocr.status="error"; STATE.ocr.error=res.message; refreshSheet(); return;
  }
  STATE.ocr.data = res.data; STATE.ocr.status="results"; refreshSheet();
}

  const serving = {qty:1, unit:"serving", grams, label:d.servingSize||`${grams}g`};
  const food = {
    id, name:d.productName||"Scanned product", cat:"My Products", isProduct:true, custom:true,

    serving
  };
  FOOD_DB.push(food);

/* ============================================================
   ANALYTICS — weekly / monthly
   ============================================================ */
function computeRangeStats(startDate, endDate){
  const meals = (STATE._allMealsCache||[]).filter(m=>m.date>=startDate && m.date<=endDate);
  const byDate = {};
  meals.forEach(m=>{ (byDate[m.date]=byDate[m.date]||[]).push(m); });
  const dateList = [];
  for(let d=startDate; d<=endDate; d=addDays(d,1)) dateList.push(d);
  const dayTotalsArr = dateList.map(d=>dayTotals(byDate[d]||[]));
  const loggedDays = dateList.filter(d=>(byDate[d]||[]).length>0).length;
  const n = loggedDays||1;
  const sums = sumMacros(dayTotalsArr);
  const avg = {cal:sums.cal/n, p:sums.p/n, c:sums.c/n, fat:sums.fat/n, fib:sums.fib/n, sug:sums.sug/n};
  const foodFreq = {};
  meals.forEach(m=>(m.items||[]).forEach(i=>{ foodFreq[i.name]=(foodFreq[i.name]||0)+1; }));
  const topFoods = Object.entries(foodFreq).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mealFreq = {};
  meals.forEach(m=>{ mealFreq[m.mealType]=(mealFreq[m.mealType]||0)+1; });
  const weekday=[], weekend=[];
  dateList.forEach((d,i)=>{ const day=new Date(d+"T00:00:00").getDay(); (day===0||day===6?weekend:weekday).push(dayTotalsArr[i].cal); });
  const avgWk = weekday.length? weekday.reduce((a,b)=>a+b,0)/weekday.length : 0;
  const avgWe = weekend.length? weekend.reduce((a,b)=>a+b,0)/weekend.length : 0;
  return {dateList, dayTotalsArr, loggedDays, totalDays:dateList.length, avg, topFoods, mealFreq, avgWk, avgWe, meals};
}

async function downloadFromApi(path, filename){
  try{
    const token = getAuthToken();
    const res = await fetch(API_BASE+path, {headers: token?{Authorization:"Bearer "+token}:{}});
    if(!res.ok) throw new Error("download failed: "+res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return true;
  }catch(e){ console.warn(e); toast("Couldn't download — check the server connection"); return false; }
}

  }
  html += '</tbody></table></div>';
  return html;
}

function formatAiMarkdown(raw){
  if(!raw) return "";
  let s = esc(raw);

  // Markdown Tables: parse lines starting and ending with |
  const lines = s.split('\n');
  const out = [];
  let inTable = false;
  let tableRows = [];

  for(let i=0; i<lines.length; i++){
    const line = lines[i].trim();
    if(line.startsWith('|') && line.endsWith('|')){
      if(/^[\|\s\-:]+$/.test(line)){ continue; }
      const cells = line.slice(1, -1).split('|').map(c=>c.trim());
      tableRows.push(cells);
      inTable = true;
    } else {
      if(inTable && tableRows.length){
        out.push(renderHtmlTable(tableRows));
        tableRows = [];
        inTable = false;
      }
      out.push(lines[i]);
    }
  }
  if(inTable && tableRows.length){
    out.push(renderHtmlTable(tableRows));
  }
  s = out.join('\n');

  // Headers: ### Header or ## Header
  s = s.replace(/^###\s*(.+)$/gm, '<div style="font-weight:700;font-size:14.5px;margin:8px 0 4px;color:var(--ink)">$1</div>');
  s = s.replace(/^##\s*(.+)$/gm, '<div style="font-weight:700;font-size:15px;margin:10px 0 4px;color:var(--ink)">$1</div>');
  // Bold: **text**
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic: *text*
  s = s.replace(/\*([^\*]+?)\*/g, '<em>$1</em>');
  // Bullets: - item or * item
  s = s.replace(/^[-*•]\s+(.+)$/gm, '<div style="display:flex;align-items:flex-start;gap:6px;margin:3px 0"><span style="color:var(--coral);font-weight:700;line-height:1.4">•</span><span style="flex:1">$1</span></div>');
  // Numbered lists: 1. item
  s = s.replace(/^(\d+)\.\s+(.+)$/gm, '<div style="display:flex;align-items:flex-start;gap:6px;margin:3px 0"><span style="color:var(--primary);font-weight:700;font-size:12px;min-width:16px;line-height:1.4">$1.</span><span style="flex:1">$2</span></div>');
  // Inline code: `code`
  s = s.replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,0.06);padding:2px 5px;border-radius:4px;font-size:12px;font-family:monospace">$1</code>');
  // Spacing
  s = s.replace(/\n\n+/g, '<div style="height:6px"></div>');
  s = s.replace(/\n/g, '<br>');
  s = s.replace(/<\/div><br>/g, '</div>');
  return s;
}

  const blob = new Blob([content], {type: mime||"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();

async function loadSampleData(){
  const ok = await confirmModal({title:"Add sample data?", body:"This adds about a week of example meals, weight entries and a recipe so you can see History, Analytics and Reports filled in.", confirmLabel:"Add sample data"});
  if(!ok) return;
  const menu = [
    [["oats_dry",40],["milk_whole",200],["banana",1]],
    [["rice_white_cooked",1],["dal_cooked",1],["mixed_veg_curry",1],["salad_greens",1]],
    [["apple",1]],
    [["roti_wheat",3],["chicken_curry",1],["spinach_cooked",1]],
  ];
  const mealTypesForMenu = ["Breakfast","Lunch","Evening snack","Dinner"];
  const startWeight = STATE.profile.startWeightKg || STATE.profile.weightKg || 70;
  for(let i=6;i>=0;i--){
    const date = addDays(todayStr(), -i);
    for(let mi=0; mi<menu.length; mi++){
      const combo = menu[mi];
      const items = combo.map(([foodId,qty])=>{
        const f = FOOD_DB_INDEX[foodId]; const unit = f.serving.unit;
        const jitter = 1 + (Math.random()*0.16-0.08);
        const m = macrosForQty(f, qty*jitter, unit);
        return {foodId:f.id, name:f.name, qty:round1(qty*jitter), unit, macros:m, source:"manual", confidence:null};
      });
      const totals = sumMacros(items.map(it=>it.macros));
      await StorageService.addToCollection("meals", {date, time:["08:00","13:00","17:00","20:00"][mi], mealType:mealTypesForMenu[mi], items, totals, source:"manual", note:"", createdAt:Date.now()});
    }
    const w = round1(startWeight - (6-i)*0.08 + (Math.random()*0.3-0.15));
    const existing = STATE.weightLogs.find(l=>l.date===date);
    if(!existing) await StorageService.addToCollection("weight_logs", {date, weight:w, note:""});
  }
  if(!STATE.recipes.some(r=>r.name==="Besan chilla")){
    const ing = [["besan_chilla",100],["cooking_oil",10],["tomato",50]];
    const ingredients = ing.map(([foodId,qty])=>{ const f=FOOD_DB_INDEX[foodId]; const m=macrosForQty(f,qty,"g"); return {foodId:f.id,name:f.name,qty,unit:"g",macros:m}; });
    const totals = sumMacros(ingredients.map(i=>i.macros));
    await StorageService.addToCollection("recipes", {name:"Besan chilla", servings:2, ingredients, totals, createdAt:Date.now()});
  }
  await Promise.all([loadAllWeightLogs(), loadRecipes(), refreshAllMealsCache()]);
  await loadMealsForDate(STATE.selectedDate);
  toast("Sample data added");
  goTo("home");
}

function buildEatContext(){
  const p = STATE.profile || { targets: { calories: 2000, protein: 120, carbs: 220, fat: 65, fibre: 30 }, goal: "maintain", diet: "balanced" };
  const t = p.targets || { calories: 2000, protein: 120, carbs: 220, fat: 65, fibre: 30 };
  const totals = dayTotals(STATE.todaysMeals || []);
  const remCal = Math.max(100, Math.round((t.calories || 2000) - totals.cal));
  const remP = Math.max(10, round1((t.protein || 120) - totals.p));
  const remC = Math.max(10, round1((t.carbs || 220) - totals.c));
  const remF = Math.max(5, round1((t.fat || 65) - totals.fat));
  const remFib = Math.max(4, round1((t.fibre || 30) - totals.fib));
  return {
    remaining: { calories: remCal, protein: remP, carbs: remC, fat: remF, fibre: remFib },
    timeOfDay: new Date().toTimeString().slice(0, 5),
    mealsAlreadyToday: (STATE.todaysMeals || []).map(m => m.mealType),
    diet: p.diet || "balanced",
    allergies: p.allergies || [],
    dislikes: p.dislikes || "",
    budget: p.budget || "medium",
    cuisine: p.cuisine || "",
    goal: p.goal || "maintain",
  };
}

function drawDailyShareCard(){
  const canvas = document.getElementById("share-canvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;

  // Background
  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, "#0f172a");
  bg.addColorStop(0.5, "#1e293b");
  bg.addColorStop(1, "#090d16");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  // Glow blobs
  const g1 = ctx.createRadialGradient(120, 120, 10, 120, 120, 240);
  g1.addColorStop(0, "rgba(235, 94, 65, 0.28)");
  g1.addColorStop(1, "rgba(235, 94, 65, 0)");
  ctx.fillStyle = g1;
  ctx.beginPath(); ctx.arc(120, 120, 240, 0, Math.PI*2); ctx.fill();

  const g2 = ctx.createRadialGradient(500, 640, 10, 500, 640, 240);
  g2.addColorStop(0, "rgba(45, 170, 140, 0.25)");
  g2.addColorStop(1, "rgba(45, 170, 140, 0)");
  ctx.fillStyle = g2;
  ctx.beginPath(); ctx.arc(500, 640, 240, 0, Math.PI*2); ctx.fill();

  // Header Brand
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("🥗 NOURISH", 40, 65);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(prettyDate(STATE.selectedDate), 40, 95);

  // Streak pill
  const streak = computeLoggingStreak();
  ctx.fillStyle = "rgba(235, 94, 65, 0.25)";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(w - 190, 42, 150, 44, 22);
  else ctx.rect(w - 190, 42, 150, 44);
  ctx.fill();
  ctx.fillStyle = "#ff6b57";
  ctx.font = "bold 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(`🔥 ${streak} Day Streak`, w - 175, 70);

  // Main Card Area
  ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(40, 130, w - 80, 260, 24);
  else ctx.rect(40, 130, w - 80, 260);
  ctx.fill();
  ctx.stroke();

  // Calorie stats
  const totals = dayTotals(STATE.todaysMeals);
  const targetCal = STATE.profile.targets.calories || 2000;
  const pct = Math.min(1.2, totals.cal / targetCal);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(`${Math.round(totals.cal)}`, w / 2, 235);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(`of ${targetCal} kcal goal`, w / 2, 275);

  // Calorie progress bar
  const barW = w - 160;
  const barX = 80;
  const barY = 320;
  ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(barX, barY, barW, 14, 7);
  else ctx.rect(barX, barY, barW, 14);
  ctx.fill();

  const fillW = Math.max(14, Math.min(barW, barW * pct));
  const grad = ctx.createLinearGradient(barX, 0, barX + fillW, 0);
  grad.addColorStop(0, "#eb5e41");
  grad.addColorStop(1, "#38bdf8");
  ctx.fillStyle = grad;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(barX, barY, fillW, 14, 7);
  else ctx.rect(barX, barY, fillW, 14);
  ctx.fill();

  ctx.fillStyle = "#38bdf8";
  ctx.font = "600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(`${Math.round(pct * 100)}% of daily calorie target`, w / 2, 360);

  // 3 Macro Cards
  ctx.textAlign = "left";
  const cardW = (w - 80 - 24) / 3;
  const mTop = 415;
  const macros = [
    { label: "PROTEIN", val: `${round1(totals.p)}g`, goal: `${STATE.profile.targets.protein||100}g`, color: "#38bdf8", bg: "rgba(56, 189, 248, 0.12)" },
    { label: "CARBS", val: `${round1(totals.c)}g`, goal: `${STATE.profile.targets.carbs||220}g`, color: "#fbbf24", bg: "rgba(251, 191, 36, 0.12)" },
    { label: "FAT", val: `${round1(totals.fat)}g`, goal: `${STATE.profile.targets.fat||65}g`, color: "#f472b6", bg: "rgba(244, 114, 182, 0.12)" }
  ];

  macros.forEach((m, i) => {
    const cx = 40 + i * (cardW + 12);
    ctx.fillStyle = m.bg;
    ctx.strokeStyle = m.color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(cx, mTop, cardW, 110, 16);
    else ctx.rect(cx, mTop, cardW, 110);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = m.color;
    ctx.font = "bold 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(m.label, cx + 16, mTop + 30);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(m.val, cx + 16, mTop + 65);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(`Goal: ${m.goal}`, cx + 16, mTop + 90);
  });

  // Hydration & Meals
  const botTop = 550;
  ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(40, botTop, w - 80, 90, 18);
  else ctx.rect(40, botTop, w - 80, 90);
  ctx.fill();
  ctx.stroke();

  const waterL = ((STATE.todaysWaterMl||0) / 1000).toFixed(1);
  ctx.fillStyle = "#60a5fa";
  ctx.font = "bold 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText("💧 HYDRATION", 60, botTop + 34);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(`${waterL} Litres`, 60, botTop + 65);

  ctx.fillStyle = "#34d399";
  ctx.font = "bold 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText("🍽️ MEALS LOGGED", w / 2 + 20, botTop + 34);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(`${STATE.todaysMeals.length} Meals`, w / 2 + 20, botTop + 65);

  // Footer Branding
  ctx.textAlign = "center";
  ctx.fillStyle = "#64748b";
  ctx.font = "500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText("Tracked with Nourish · Free nutrition for everyone", w / 2, 700);
}

function downloadShareCard(){
  const canvas = document.getElementById("share-canvas");
  if(!canvas) return;
  const link = document.createElement("a");
  link.download = `nourish-streak-${STATE.selectedDate}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
  toast("Progress card downloaded!");
}

async function shareCardNative(){
  const canvas = document.getElementById("share-canvas");
  if(!canvas) return;
  try{
    if(navigator.share && canvas.toBlob){
      canvas.toBlob(async blob=>{
        const file = new File([blob], `nourish-${STATE.selectedDate}.png`, {type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:"My Nourish Nutrition Streak", text:"Check out my nutrition streak on Nourish!"});
          return;
        }
        downloadShareCard();
      });
    } else {
      downloadShareCard();
    }
  }catch(e){
    downloadShareCard();
  }
}

   ============================================================ */
function installPWA(){
  if(window.deferredInstallPrompt){
    window.deferredInstallPrompt.prompt();
    window.deferredInstallPrompt.userChoice.then((res)=>{
      if(res.outcome==='accepted') toast("Thank you for installing Nourish!");
      window.deferredInstallPrompt = null;
      STATE.canInstallPWA = false;
      render();
    });
  } else {
    toast("To install Nourish, tap Share or 3-dots in your browser and select 'Add to Home Screen'");
  }
}
