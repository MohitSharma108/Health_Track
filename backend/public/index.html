/* ============================================================
   AUTH — the self-hosted backend requires a login; the hosted Claude
   artifact build has no equivalent screen since the platform handles
   identity itself. Shown whenever there's no valid token.
   ============================================================ */
function openAuthModal(mode="register"){
  STATE.showAuthModal = true;
  STATE.authMode = mode;
  STATE.authError = null;
  render();
}
function dismissAuthModal(){
  STATE.showAuthModal = false;
  STATE.auth = {loggedOut: false};
  STATE.authError = null;
  render();
}

function renderAuthScreen(){
  const mode = STATE.authMode||"login";
  const f = STATE.authForm||(STATE.authForm={email:"",password:"",name:""});
  const expired = isTrialExpired();
  let title = mode==='login' ? 'Welcome Back!' : 'Save & Sync Progress';
  let subtitle = mode==='login'
    ? 'Log in to access your cloud meal logs and daily goals.'
    : (expired ? '7-Day Free Pass complete! Create your account to keep your streak.' : 'Create your free account to sync your 7-day trial data to the cloud.');

  return `<div class="screen" style="padding-top:6vh;text-align:center">
    <div style="font-size:46px;margin-bottom:6px">🥗</div>
    <h1 style="font-size:26px;margin-bottom:4px">${title}</h1>
    <p class="muted small" style="margin-bottom:18px;max-width:320px;margin-left:auto;margin-right:auto;line-height:1.4">${subtitle}</p>

    <!-- Segmented Tab: Log In vs Create Account -->
    <div class="segmented" style="max-width:320px;margin:0 auto 16px">
      <button type="button" class="${mode==='login'?'active':''}" onclick="STATE.authMode='login'; STATE.authError=null; render()">🔐 Log In</button>
      <button type="button" class="${mode==='register'?'active':''}" onclick="STATE.authMode='register'; STATE.authError=null; render()">✨ Create Account</button>
    </div>

    <div class="stack" style="text-align:left;max-width:320px;margin:0 auto">
      ${mode==='register'?`<div class="field"><label>Your Name (optional)</label><input type="text" autocomplete="name" placeholder="Enter your name" value="${esc(f.name)}" oninput="STATE.authForm.name=this.value"></div>`:""}
      <div class="field"><label>Email address</label><input type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="you@example.com" value="${esc(f.email)}" oninput="STATE.authForm.email=this.value"></div>
      <div class="field"><label>Password</label><input type="password" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="Enter your password" value="${esc(f.password)}" oninput="STATE.authForm.password=this.value" onkeydown="if(event.key==='Enter') submitAuth()"></div>
      ${STATE.authError?`<div class="error-box">${esc(STATE.authError)}</div>`:""}
      <button class="btn btn-primary btn-block" onclick="submitAuth()" ${STATE.authLoading?'disabled':''}>${STATE.authLoading?'Please wait…':(mode==='login'?'Log In & Access Data':'Create Account & Sync')}</button>
      
      <div style="text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
        <button class="link-btn" style="font-weight:600;font-size:13px;color:var(--primary)" onclick="dismissAuthModal()">
          ← Continue to Log Meals & History (Guest Mode)
        </button>
      </div>
    </div>
    ${!RUNTIME.apiUp?`<div class="error-box" style="margin-top:20px;max-width:320px;margin-left:auto;margin-right:auto">Can't reach the Nourish server at ${esc(API_BASE)}. Make sure the backend is running, then reload.</div>`:""}
  </div>`;
}

async function syncGuestDataToServer(){
  try{
    const lp = LocalFallback.store["profile/main"];
    if(lp && lp.targets){
      const {targets, ...rest} = lp;
      await apiPut("/profile", rest).catch(()=>{});
      if(targets){
        await apiPut("/profile/goals", {
          calories: targets.calories,
          proteinG: targets.protein,
          carbsG: targets.carbs,
          fatG: targets.fat,
          fibreG: targets.fibre
        }).catch(()=>{});
      }
    }
    const mealKeys = Object.keys(LocalFallback.store).filter(k=>k.startsWith("meals/"));
    for(const k of mealKeys){
      const m = LocalFallback.store[k];
      if(m && m.items && m.items.length){
        await apiPost("/meals", feMealToBeBody(m)).catch(e=>console.warn("meal sync failed", e));
      }
    }
    const weightKeys = Object.keys(LocalFallback.store).filter(k=>k.startsWith("weight_logs/"));
    for(const k of weightKeys){
      const w = LocalFallback.store[k];
      if(w && w.weight){
        await apiPost("/weight", {date:w.date, weightKg:w.weight, note:w.note}).catch(e=>console.warn("weight sync failed", e));
      }
    }
    const waterKeys = Object.keys(LocalFallback.store).filter(k=>k.startsWith("water/"));
    for(const k of waterKeys){
      const dateStr = k.replace("water/", "");
      const amountMl = LocalFallback.store[k];
      if(amountMl > 0){
        await apiPost("/water", {date:dateStr, amountMl}).catch(()=>{});
      }
    }
    toast("✨ All guest meals & progress synced to your cloud account!");
  }catch(err){
    console.warn("Sync guest data error:", err);
  }
}

async function submitAuth(){
  const mode = STATE.authMode||"login"; const f = STATE.authForm;
  const cleanEmail = (f.email||"").trim().toLowerCase();
  if(!cleanEmail || !f.password){ STATE.authError="Please enter your email and password."; render(); return; }
  STATE.authLoading = true; STATE.authError=null; render();
  try{
    const body = mode==='login' ? {email:cleanEmail, password:f.password} : {email:cleanEmail, password:f.password, name:f.name||""};
    const res = await apiPost(`/auth/${mode}`, body);
    setAuthToken(res.token);
    STATE.auth = {loggedOut:false};
    STATE.showAuthModal = false;
    STATE.authForm = {email:"", password:"", name:""};
    if(mode === 'register' || res.isNewUser){
      await syncGuestDataToServer();
    }
    await loadEverythingAfterAuth();
    toast(res.isNewUser ? "Welcome! Account created and data synced." : "Welcome back! Logged in successfully.");
  }catch(e){
    STATE.authLoading = false;
    STATE.authError = (e && e.message) || "Something went wrong — please try again.";
    render();
  }
}

async function loadEverythingGuest(){
  STATE.profile = LocalFallback.store["profile/main"] || null;
  STATE.settings = LocalFallback.store["settings/main"] || {
    reportTime: "20:00",
    units: "metric",
    appearance: "system",
    aiEnabled: true,
    waterGoalMl: 2500,
    notifPrefs: {mealReminders:true, hydration:true, loggingReminder:true, goalProgress:true, dailyReport:false, weeklyReport:false}
  };
  if(STATE.settings && STATE.settings.appearance && STATE.settings.appearance!=="system"){
    document.documentElement.setAttribute("data-theme", STATE.settings.appearance);
  }
  if(STATE.profile && STATE.profile.targets){
    await loadMealsForDate(STATE.selectedDate);
    const weightList = Object.keys(LocalFallback.store)
      .filter(k=>k.startsWith("weight_logs/"))
      .map(k=>LocalFallback.store[k]);
    weightList.sort((a,b)=>a.date.localeCompare(b.date));
    STATE.weightLogs = weightList;
    STATE.favorites = Object.keys(LocalFallback.store)
      .filter(k=>k.startsWith("favorites/"))
      .map(k=>LocalFallback.store[k]);
    STATE.recipes = Object.keys(LocalFallback.store)
      .filter(k=>k.startsWith("recipes/"))
      .map(k=>LocalFallback.store[k]);
    await loadCustomFoods();
    await refreshAllMealsCache();
  }
  STATE.authLoading = false;
}

async function loadEverythingAfterAuth(){
  STATE.profile = await StorageService.getDoc("profile/main");
  STATE.settings = await StorageService.getDoc("settings/main");
  if(STATE.settings && STATE.settings.appearance && STATE.settings.appearance!=="system"){
    document.documentElement.setAttribute("data-theme", STATE.settings.appearance);
  }
  if(STATE.profile && STATE.profile.targets){
    await Promise.all([loadCustomFoods(), loadFavorites(), loadRecipes(), loadAllWeightLogs(), loadNotifications(), refreshAllMealsCache()]);
    await loadMealsForDate(STATE.selectedDate);
  }
  STATE.authLoading = false;
  render();
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  window.deferredInstallPrompt = e;
  STATE.canInstallPWA = true;
  if(STATE.ready) render();
});

async function boot(){
  try{
    if('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')){
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg skipped:', err));
    }
    loadLocalFallback();
    await initRuntime();
    if(getAuthToken()){
      await loadEverythingAfterAuth();
    } else {
      await loadEverythingGuest();
    }
  }catch(e){
    console.error("boot error", e);
    STATE.bootError = "There was a problem loading your data. Please reload.";
  }
  STATE.ready = true;
  render();
  setInterval(()=>{
    if(!getAuthToken()) return;
    const before = STATE.notifications.filter(n=>!n.read).length;
    loadNotifications().then(()=>{
      const after = STATE.notifications.filter(n=>!n.read).length;
      if(after!==before) render();
    }).catch(()=>{});
  }, 90000);
}
boot();
