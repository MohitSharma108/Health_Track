services:
  - type: web
    name: nourish-app
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: DATABASE_URL
        sync: false # Optional: Paste your free Neon.tech PostgreSQL URL (or leave blank to use zero-config local DB)
      - key: GROQ_API_KEY
        sync: false # Paste your Groq API key here (free tier at console.groq.com)
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: ANTHROPIC_API_KEY
        sync: false # Optional fallback: Claude API key
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
